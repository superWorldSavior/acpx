name: Release

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: 24

jobs:
  native:
    name: Native lifeline (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            runner: macos-15
          - target: darwin-x64
            runner: macos-15-intel
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - target: linux-x64
            runner: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          check-latest: true
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run build:native -- --target ${{ matrix.target }}
      - run: pnpm run build:native:check -- --target ${{ matrix.target }}
      - name: Verify Linux helper is statically linked
        if: startsWith(matrix.target, 'linux-')
        run: file "dist/native/lifeline-${{ matrix.target }}" | grep -Eiq 'static(ally linked|-pie linked)'
      - name: Verify Darwin minimum OS version
        if: startsWith(matrix.target, 'darwin-')
        run: |
          minos=$(otool -l "dist/native/lifeline-${{ matrix.target }}" | awk '
            $1 == "cmd" { block = $2 }
            block == "LC_BUILD_VERSION" && $1 == "minos" { print $2; exit }
            block == "LC_VERSION_MIN_MACOSX" && $1 == "version" { print $2; exit }
          ')
          test "$minos" = "11.0"

      - name: Upload target helper
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-lifeline-${{ matrix.target }}
          path: dist/native/lifeline-${{ matrix.target }}
          if-no-files-found: error

  release:
    # DO NOT change this job back to a self-hosted runner.
    # npm trusted publishing + provenance for GitHub Actions releases
    # requires a GitHub-hosted runner, and publishing fails on self-hosted
    # environments with:
    # "Unsupported GitHub Actions runner environment: self-hosted".
    needs: native
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          check-latest: true
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Validate package metadata for trusted publishing
        run: |
          node - <<'NODE'
          const { readFileSync } = require("node:fs");

          const pkg = JSON.parse(readFileSync("package.json", "utf8"));
          const expectedAuthor = "OpenClaw Team <dev@openclaw.ai>";
          const expectedRepoUrl = "https://github.com/openclaw/acpx";

          const normalizeRepoUrl = (value) =>
            String(value ?? "")
              .trim()
              .replace(/^git\+/, "")
              .replace(/\.git$/i, "")
              .replace(/\/+$/, "");

          const actualRepoUrl = normalizeRepoUrl(pkg?.repository?.url);
          const expectedRepoUrlNormalized = normalizeRepoUrl(expectedRepoUrl);

          const errors = [];
          if (actualRepoUrl !== expectedRepoUrlNormalized) {
            errors.push(
              `package.json repository.url must resolve to ${expectedRepoUrlNormalized}; found ${actualRepoUrl || "<missing>"}`
            );
          }
          if ((pkg?.author ?? "") !== expectedAuthor) {
            errors.push(
              `package.json author must be exactly "${expectedAuthor}"; found "${pkg?.author ?? ""}"`
            );
          }

          if (errors.length > 0) {
            for (const err of errors) {
              console.error(err);
            }
            process.exit(1);
          }

          console.log("Package metadata validated.");
          NODE

      - name: Validate release tag
        env:
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main --depth=1

          node - <<'NODE'
          const { execFileSync } = require("node:child_process");
          const { readFileSync } = require("node:fs");

          const releaseTag = process.env.RELEASE_TAG ?? "";
          const releaseSha = process.env.RELEASE_SHA ?? "";
          const semverTag = /^v\d+\.\d+\.\d+$/;

          if (!semverTag.test(releaseTag)) {
            console.error(
              `Release tags must match vX.Y.Z; received ${releaseTag || "<missing>"}.`
            );
            process.exit(1);
          }

          const pkg = JSON.parse(readFileSync("package.json", "utf8"));
          const expectedTag = `v${pkg.version}`;

          if (releaseTag !== expectedTag) {
            console.error(
              `Release tag ${releaseTag} does not match package.json version ${pkg.version}; expected ${expectedTag}.`
            );
            process.exit(1);
          }

          try {
            execFileSync(
              "git",
              ["merge-base", "--is-ancestor", releaseSha, "origin/main"],
              { stdio: "ignore" }
            );
          } catch {
            console.error(
              `Tagged commit ${releaseSha} is not contained in origin/main.`
            );
            process.exit(1);
          }

          console.log(
            `Release tag ${releaseTag} matches package.json and points to a commit on origin/main.`
          );
          NODE

      - name: Ensure version is not already published
        run: |
          set -euo pipefail
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          error_log="$(mktemp)"

          if npm view "acpx@${PACKAGE_VERSION}" version >/dev/null 2>"${error_log}"; then
            echo "acpx@$PACKAGE_VERSION is already published on npm."
            exit 1
          fi

          if ! grep -Eq "E404|404 Not Found" "${error_log}"; then
            cat "${error_log}" >&2
            exit 1
          fi

          echo "Publishing acpx@$PACKAGE_VERSION"

      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm run build

      - name: Download native helpers
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: native-lifeline-*
          path: dist/native
          merge-multiple: true

      - name: Assemble and verify native package
        run: |
          pnpm run build:native:assemble
          pnpm run build:native:check

      - name: Smoke-test packed native payload
        run: |
          set -euo pipefail
          PACKAGE_TGZ="acpx-$(node -p "require('./package.json').version").tgz"
          npm pack --json >/tmp/acpx-npm-pack.json
          SMOKE_DIR=$(mktemp -d)
          trap 'rm -rf "$SMOKE_DIR" "$PACKAGE_TGZ"' EXIT
          tar -xzf "$PACKAGE_TGZ" -C "$SMOKE_DIR"
          test -f "$SMOKE_DIR/package/dist/native/lifeline-manifest.json"
          for target in darwin-arm64 darwin-x64 linux-arm64 linux-x64; do
            test -x "$SMOKE_DIR/package/dist/native/lifeline-$target"
          done
          node scripts/build-native-lifeline.mjs --check --native-dir "$SMOKE_DIR/package/dist/native"

      - name: Publish
        run: npm publish --access public --provenance
